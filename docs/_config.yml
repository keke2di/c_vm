title: cVM
description: A small Python-like language runtime with a custom bytecode compiler and native C virtual machine.
url: https://keke2di.github.io
baseurl: /c_vm

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

color_scheme: light

search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 4
  preview_words_after: 6
  rel_url: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "cVM on GitHub": "https://github.com/keke2di/c_vm"
aux_links_new_tab: true

mermaid:
  version: "11.4.1"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
  new:
    title: New in v0.2.1
    color: green

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
